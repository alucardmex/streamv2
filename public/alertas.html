<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Alertas</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Opciones por URL: ?escala=1.3  ?posicion=arriba|centro|abajo  ?sonido=0  ?diseno=botin|clasica
     ?vista=1 es la vista previa del panel: no recibe las alertas reales, solo las de prueba. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: 'Outfit', system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; pointer-events: none; }
  #stage.arriba { align-items: flex-start; padding-top: 8vh; }
  #stage.abajo { align-items: flex-end; padding-bottom: 10vh; }

  /* =====================================================================
     BOTÍN (diseño nuevo): cada alerta cae como botín de un juego.
     El color dice qué tan grande es: ¡Regalo! (azul) · ¡Épico! 100+ 💎 (morado)
     · ¡Legendario! 1,000+ (dorado) · ¡Mítico! 10,000+ (rojo).
     ===================================================================== */
  .bt, .btp { --c: #25f4ee; --c2: #c9fdff; --glow: rgba(37,244,238,.5); --ink: #14081f; }
  .bt { --p: 150px; --nf: 50px; --af: 76px;
    position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; color: #fff;
    transform: scale(var(--s)); transform-origin: center; }
  .bt.r1 { --p: 168px; --nf: 54px; --af: 86px; }
  .bt.r2 { --p: 186px; --nf: 58px; --af: 96px; }
  .bt.r3 { --p: 204px; --nf: 62px; --af: 106px; }
  .r1:is(.bt, .btp) { --c: #b45cff; --c2: #ecd6ff; --glow: rgba(180,92,255,.55); }
  .r2:is(.bt, .btp) { --c: #ffb21e; --c2: #fff0b8; --glow: rgba(255,178,30,.55); }
  .r3:is(.bt, .btp) { --c: #ff2d55; --c2: #ffd0da; --glow: rgba(255,45,85,.6); }
  .follow:is(.bt, .btp) { --c: #ff4fa3; --c2: #ffd6ea; --glow: rgba(255,79,163,.5); }
  .share:is(.bt, .btp) { --c: #25f4ee; --c2: #c9fdff; --glow: rgba(37,244,238,.5); }
  .kick:not(.gift):is(.bt, .btp) { --c: #53fc18; --c2: #dcffcc; --glow: rgba(83,252,24,.45); }

  .bt-in { display: flex; flex-direction: column; align-items: center; }
  .bt.shake .bt-in { animation: btShake .65s ease .32s both; }
  .bt.out .bt-in { animation: btOut .5s cubic-bezier(.5,0,.75,0) both; }
  @keyframes btShake { 0%, 100% { transform: none; } 12% { transform: translate(-11px, 5px) rotate(-1.2deg); } 26% { transform: translate(10px, -6px) rotate(1deg); }
    40% { transform: translate(-7px, 4px) rotate(-.5deg); } 56% { transform: translate(5px, -2px); } 74% { transform: translate(-2px, 1px); } }
  @keyframes btOut { to { opacity: 0; transform: translateY(-50px) scale(.8); filter: blur(5px); } }

  /* La foto: llega desde arriba como botín, con su aro de color */
  .bt-who { position: relative; width: var(--p); height: var(--p); margin-bottom: 24px; animation: btLand .75s cubic-bezier(.2,1.25,.35,1) both; }
  @keyframes btLand { 0% { opacity: 0; transform: translateY(-150px) scale(.35); filter: brightness(3); }
    55% { opacity: 1; transform: translateY(8px) scale(1.06); filter: brightness(1.6); } 100% { transform: none; filter: none; } }
  .bt-beam { position: absolute; z-index: -2; left: 50%; bottom: 50%; width: calc(var(--p) * .8); height: 115vh; transform: translateX(-50%); transform-origin: 50% 100%;
    background: linear-gradient(to top, var(--glow), rgba(255,255,255,.07) 55%, transparent 92%);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
    animation: btBeam .55s cubic-bezier(.2,.9,.3,1) both, btBeamPulse 1.8s ease-in-out .7s infinite; }
  .bt-beam::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 5px; margin-left: -2.5px; background: linear-gradient(to top, #fff, rgba(255,255,255,.35) 45%, transparent 85%); }
  .bt.r0 .bt-beam { width: calc(var(--p) * .55); height: 55vh; }
  .bt.r3 .bt-beam { width: calc(var(--p) * 1.15); }
  @keyframes btBeam { from { opacity: 0; transform: translateX(-50%) scaleY(0); } to { opacity: 1; transform: translateX(-50%) scaleY(1); } }
  @keyframes btBeamPulse { 0%, 100% { opacity: 1; transform: translateX(-50%); } 50% { opacity: .6; transform: translateX(-50%); } }
  .bt-rays { position: absolute; z-index: -1; left: 50%; top: 50%; width: calc(var(--p) * 3.2); height: calc(var(--p) * 3.2);
    margin: calc(var(--p) * -1.6) 0 0 calc(var(--p) * -1.6); animation: btRaysIn .9s ease-out .1s both; }
  .bt-rays::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(var(--glow) 0deg 6deg, transparent 6deg 18deg);
    -webkit-mask-image: radial-gradient(closest-side, #000 18%, transparent 74%); mask-image: radial-gradient(closest-side, #000 18%, transparent 74%); animation: btSpin 18s linear infinite; }
  .bt-rays::after { content: ''; position: absolute; inset: 24%; border-radius: 50%; background: radial-gradient(closest-side, var(--glow), transparent); }
  .bt.r0 .bt-rays { opacity: .6; }
  @keyframes btRaysIn { from { opacity: 0; transform: scale(.2); } }
  @keyframes btSpin { to { transform: rotate(360deg); } }
  .bt-wave { position: absolute; inset: 0; border-radius: 50%; border: 5px solid var(--c); opacity: 0; animation: btWave .9s ease-out .3s forwards; }
  .bt-wave.w2 { animation-delay: .5s; border-width: 3px; }
  .bt-wave.w3 { animation-delay: .7s; border-width: 2px; border-color: #fff; }
  @keyframes btWave { 0% { opacity: .95; transform: scale(.9); } 100% { opacity: 0; transform: scale(2.7); } }
  .bt-mote { position: absolute; z-index: -1; left: 50%; bottom: 45%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 10px 3px var(--c); opacity: 0; animation: btMote 2.3s ease-in infinite; }
  @keyframes btMote { 0% { opacity: 0; transform: translate(var(--x), 0) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), -340px) scale(1.1); } }

  .bt-core { position: absolute; inset: 0; animation: btFloat 3.2s ease-in-out 1.2s infinite; }
  @keyframes btFloat { 50% { transform: translateY(-7px); } }
  .bt-ret { position: absolute; inset: -24px; border-radius: 50%; background: repeating-conic-gradient(var(--c) 0deg 5deg, transparent 5deg 22.5deg); opacity: .9;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
    animation: btSpin 10s linear infinite reverse; }
  .bt-ring { position: absolute; inset: -10px; border-radius: 50%; background: conic-gradient(var(--c), var(--c2), #fff, var(--c2), var(--c), var(--c2), var(--c));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px)); mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
    animation: btSpin 2.4s linear infinite; }
  .bt-pic { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: var(--ink);
    box-shadow: 0 0 0 4px var(--ink), 0 0 36px 8px var(--glow), 0 16px 36px rgba(0,0,0,.55); }
  .bt-pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .bt-ini { width: 100%; height: 100%; display: grid; place-items: center; font: 900 calc(var(--p) * .46)/1 'Outfit', system-ui, sans-serif; color: #fff; text-shadow: 0 4px 16px rgba(0,0,0,.35); }
  /* El regalo, como estampa sobre la foto */
  .bt-st { position: absolute; right: -17%; top: -9%; width: 52%; height: 52%; display: grid; place-items: center; border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, #3d1e5e, var(--ink) 72%); border: 3px solid var(--c); box-shadow: 0 0 22px var(--glow), 0 8px 18px rgba(0,0,0,.5);
    font-size: calc(var(--p) * .29); line-height: 1; animation: btSticker .55s cubic-bezier(.2,1.7,.4,1) .62s both, btWiggle 2.6s ease-in-out 1.4s infinite; }
  .bt-st img { width: 82%; height: 82%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
  .bt-st.kc { background: radial-gradient(circle at 35% 30%, #c8ffa8, #53fc18 45%, #2c9e08); color: #0b0b0b; border-color: #fff; font: 900 calc(var(--p) * .3)/1 system-ui, sans-serif; }
  @keyframes btSticker { from { opacity: 0; transform: scale(0) rotate(-140deg); } }
  @keyframes btWiggle { 0%, 48%, 100% { transform: rotate(0); } 8% { transform: rotate(-13deg) scale(1.1); } 18% { transform: rotate(10deg) scale(1.05); } 28% { transform: rotate(-6deg); } 38% { transform: rotate(3deg); } }
  /* El sello: ¡Regalo! · ¡Épico! · ¡Legendario! · ¡Mítico! */
  .bt-plate { position: absolute; z-index: 3; left: 50%; bottom: -22px; white-space: nowrap; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55));
    transform: translateX(-50%) rotate(-3deg); animation: btSlam .5s cubic-bezier(.2,1.5,.4,1) .45s both; }
  .bt-plate b { position: relative; display: block; overflow: hidden; padding: .2em 1em .02em; font: 700 calc(var(--nf) * .66)/1 'Teko', 'Impact', sans-serif; letter-spacing: 2px; color: var(--ink);
    background: linear-gradient(180deg, #fff, var(--c2) 38%, var(--c)); clip-path: polygon(.6em 0, calc(100% - .6em) 0, 100% 50%, calc(100% - .6em) 100%, .6em 100%, 0 50%); }
  .bt-plate b::after { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.9), transparent);
    animation: btShine 2.4s ease-in-out 1.1s infinite; }
  @keyframes btSlam { 0% { opacity: 0; transform: translateX(-50%) scale(2.6) rotate(-14deg); filter: blur(6px); }
    60% { opacity: 1; transform: translateX(-50%) scale(.92) rotate(-2deg); filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); }
    100% { transform: translateX(-50%) rotate(-3deg); filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); } }
  @keyframes btShine { 0% { left: -60%; } 45%, 100% { left: 130%; } }

  /* Quién: nombre grande con relieve del color de la alerta */
  .bt-name { margin-top: 22px; white-space: nowrap; font: 900 var(--nf)/1.08 'Outfit', system-ui, sans-serif; color: #fff;
    text-shadow: 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 6px 0 var(--c), 0 9px 0 var(--ink), 0 16px 26px rgba(0,0,0,.6); }
  .bt-name .tx-name > span { display: inline-block; white-space: pre; animation: btLetter .5s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes btLetter { from { opacity: 0; transform: translateY(-46px) scale(1.5) rotate(-8deg); } }
  .bt-what { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; max-width: 92vw; padding: 7px 22px; border-radius: 999px;
    background: rgba(20,8,31,.84); box-shadow: inset 0 0 0 2px rgba(255,255,255,.13), 0 8px 20px rgba(0,0,0,.35);
    font: 700 26px/1.15 'Outfit', system-ui, sans-serif; white-space: nowrap; animation: btUp .45s cubic-bezier(.2,1.3,.4,1) .85s both; }
  .bt-what b { color: var(--c2); font-weight: 900; }
  .bt-what .gi2 { width: 36px; height: 36px; object-fit: contain; display: inline-grid; place-items: center; font-size: 28px; }
  .bt-msg { margin-top: 8px; max-width: 640px; font: 700 italic 22px/1.25 'Outfit', system-ui, sans-serif; color: #f3ecff; text-shadow: 0 2px 8px rgba(0,0,0,.85);
    animation: btUp .45s ease-out 1s both; }
  /* Cuánto: número grande que sube */
  .bt-amt { margin-top: 4px; display: flex; align-items: center; gap: 12px; font: 700 var(--af)/1 'Teko', 'Impact', sans-serif; letter-spacing: 1px;
    filter: drop-shadow(0 4px 0 var(--ink)) drop-shadow(0 0 18px var(--glow)); animation: btUp .45s cubic-bezier(.2,1.3,.4,1) .95s both; }
  .bt-amt .cur { font-size: .5em; line-height: 1; }
  .bt-amt .cur.kc { display: inline-grid; place-items: center; width: 1em; height: 1em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c8ffa8, #53fc18 45%, #2c9e08); color: #0b0b0b; font: 900 .45em/1 system-ui, sans-serif; }
  .bt-num { display: inline-grid; }
  .bt-num > span { grid-area: 1 / 1; padding-top: .14em; text-align: center; }
  .bt-num .ghost { visibility: hidden; }
  .bt-num .live { background: linear-gradient(180deg, #fff 30%, var(--c2) 58%, var(--c)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .bt-amt.hit { animation: btHit .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes btHit { 40% { transform: scale(1.2); } }
  @keyframes btUp { from { opacity: 0; transform: translateY(18px) scale(.9); } }

  /* Lo que sale volando por toda la pantalla */
  .bt-p { position: fixed; z-index: 40; pointer-events: none; font: 900 26px/1 system-ui, sans-serif; animation: btP 1.3s cubic-bezier(.15,.8,.3,1) forwards; }
  @keyframes btP { 0% { opacity: 1; transform: translate(-50%, -50%) scale(.3); } 70% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--r)); } }
  .bt-flash { position: fixed; inset: 0; z-index: 30; pointer-events: none; animation: btFlash .8s ease-out forwards;
    background: radial-gradient(circle at var(--fx, 50%) var(--fy, 45%), rgba(255,255,255,.8), var(--glow) 28%, transparent 62%); }
  @keyframes btFlash { 0% { opacity: 0; } 14% { opacity: 1; } 100% { opacity: 0; } }
  .bt-rain { position: fixed; top: -70px; z-index: 35; pointer-events: none; line-height: 1; animation: btRain linear forwards; }
  @keyframes btRain { to { transform: translateY(calc(100vh + 140px)) rotate(var(--r)); } }

  /* Alertas con tu video, foto o GIF: abajo va la tarjeta con la foto, el nombre y la cantidad */
  .btp { position: relative; margin-top: 14px; display: flex; align-items: center; gap: 16px; padding: 12px 28px 12px 12px; border-radius: 999px; text-align: left; color: #fff;
    background: linear-gradient(135deg, rgba(42,18,64,.95), rgba(16,7,27,.92)); box-shadow: inset 0 0 0 2px var(--c), 0 0 26px var(--glow), 0 14px 34px rgba(0,0,0,.5); }
  .btp .pic { position: relative; width: 78px; height: 78px; flex: none; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px var(--c); }
  .btp .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .btp .bt-ini { font-size: 34px; }
  .btp .n { font: 900 32px/1.05 'Outfit', system-ui, sans-serif; white-space: nowrap; max-width: 560px; overflow: hidden; text-overflow: ellipsis; }
  .btp .w { margin-top: 3px; font: 700 21px/1.2 'Outfit', system-ui, sans-serif; color: #efe6ff; white-space: nowrap; }
  .btp .w b { color: var(--c2); font-weight: 900; }
  .btp .w .gi2 { width: 28px; height: 28px; object-fit: contain; vertical-align: -7px; display: inline-block; font-size: 22px; }

  /* =====================================================================
     CLÁSICA (el diseño de antes)
     ===================================================================== */
  .alert {
    --accent: #fe2c55;
    position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;
    color: #fff; transform-origin: center; animation: pop .7s cubic-bezier(.2, 1.6, .4, 1) both;
  }
  .alert.out { animation: out .45s ease-in both; }
  @keyframes pop { from { opacity: 0; transform: scale(var(--s)) scale(.3) translateY(40px); } to { opacity: 1; transform: scale(var(--s)); } }
  @keyframes out { to { opacity: 0; transform: scale(var(--s)) scale(.85) translateY(-30px); } }

  .halo {
    position: absolute; top: 0; left: 50%; width: 300px; height: 300px; margin-left: -150px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, var(--accent), transparent 30%, #25f4ee, transparent 60%, var(--accent), transparent);
    filter: blur(28px); opacity: .55; animation: spin 4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gift-img {
    position: relative; width: 190px; height: 190px; object-fit: contain; display: grid; place-items: center;
    font-size: 130px; line-height: 1; filter: drop-shadow(0 10px 25px rgba(0,0,0,.45));
    animation: bob 1.6s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }
  .card {
    position: relative; margin-top: 10px; display: flex; align-items: center; gap: 16px;
    padding: 14px 26px 14px 14px; border-radius: 22px;
    background: rgba(15, 15, 22, .82); border: 2px solid rgba(255,255,255,.12);
    box-shadow: 0 16px 50px rgba(0,0,0,.5), 0 0 0 4px var(--accent) inset; backdrop-filter: blur(6px);
  }
  .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; background: #333; display: grid; place-items: center; font-size: 28px; font-weight: 900; flex: none; }
  .txt { text-align: left; }
  .name { font-size: 34px; font-weight: 900; line-height: 1.05; text-shadow: 0 3px 0 rgba(0,0,0,.35); max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .what { font-size: 24px; font-weight: 600; opacity: .95; margin-top: 4px; }
  .what b { color: #25f4ee; font-weight: 800; }
  .count { display: inline-block; font-weight: 900; color: var(--accent); }
  .value { font-size: 18px; opacity: .8; margin-top: 2px; }

  .alert.tier2 { --accent: #ffb547; }
  .alert.tier3 { --accent: #b26bff; }
  .alert.tier3 .gift-img { width: 240px; height: 240px; font-size: 170px; }
  .alert.follow { --accent: #25f4ee; }
  /* Kick */
  .alert.sub, .alert.kick.follow { --accent: #53fc18; }
  .alert.sub .what b, .alert.kicks .what b { color: #53fc18; }
  .kcoin { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #b6ff8f, #53fc18 45%, #2c9e08); color: #0b0b0b; font-family: system-ui, sans-serif; font-weight: 900; box-shadow: inset 0 -8px 0 rgba(0,0,0,.18), 0 0 40px rgba(83,252,24,.45); }
  .gift-img.kcoin { width: 150px; height: 150px; font-size: 100px; }
  .alert.tier3 .gift-img.kcoin { width: 200px; height: 200px; font-size: 130px; }
  .gi.kcoin { display: inline-grid; place-items: center; width: 1.1em; height: 1.1em; font-size: .9em; vertical-align: -.15em; margin-right: 4px; box-shadow: none; }

  /* Alertas personalizadas (tu video, foto o GIF) */
  .custom-media { position: relative; display: block; max-width: 92vw; object-fit: contain; border-radius: 14px; filter: drop-shadow(0 12px 30px rgba(0,0,0,.45)); }
  .size-chico .custom-media { max-height: 220px; max-width: 360px; }
  .size-mediano .custom-media { max-height: 340px; max-width: 560px; }
  .size-grande .custom-media { max-height: 480px; max-width: 800px; }
  .alert.size-completo { position: fixed; inset: 0; justify-content: flex-end; padding-bottom: 6vh; }
  .size-completo .custom-media { position: fixed; inset: 0; width: 100vw; height: 100vh; max-width: none; border-radius: 0; filter: none; }
  .alert.custom .card { margin-top: 14px; }
  /* El regalo en la línea de texto (se ve en las alertas con tu video o foto) */
  .gi { display: none; }
  .alert.custom .gi { display: inline-block; width: 32px; height: 32px; object-fit: contain; vertical-align: -8px; margin-right: 4px; font-size: 26px; line-height: 32px; }

  .confetti { position: fixed; top: -20px; width: 10px; height: 16px; border-radius: 2px; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div id="stage"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/gifts.js"></script>
<script src="/faces.js"></script>
<script>
const params = new URLSearchParams(location.search);
const scale = Number(params.get('escala')) || 1;
const forceMute = params.get('sonido') === '0';
const PREVIEW = params.get('vista') === '1';
const stage = document.getElementById('stage');
stage.className = params.get('posicion') || 'centro';

const socket = io();
let settings = { alerts: { minDiamonds: 1, duration: 6, sound: true, volume: 0.6, showFollows: true, showShares: false, style: 'botin' } };
let catalog = [];
socket.on('config', (c) => { settings = c.settings; if (c.giftCatalog) catalog = c.giftCatalog; });
socket.on('giftCatalog', (l) => { catalog = l || []; });
// Diseño de las alertas: 'botin' (el nuevo) o 'clasica' (el de antes). ?diseno= en el link manda sobre el panel.
const design = () => ((params.get('diseno') || settings.alerts.style || 'botin') === 'clasica' ? 'clasica' : 'botin');

const queue = [];
let busy = false;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString('es-MX');
const rnd = (a, b) => a + Math.random() * (b - a);

// Kick tiene sus propios ajustes (pestaña Kick del panel).
const kickAl = () => settings.kick?.alerts || { showKicks: true, showSubs: true, showFollows: true, minKicks: 1 };
socket.on('gift', (g) => {
  if (PREVIEW) return;
  if (g.platform === 'kick') {
    if (!kickAl().showKicks || g.total < (kickAl().minKicks || 0)) return;
    queue.push({ type: 'gift', ...g });
    return run();
  }
  // Un regalo con alerta propia se muestra aunque cueste menos que el mínimo.
  if (g.total < (settings.alerts.minDiamonds || 0) && !findRule({ type: 'gift', ...g }, true)) return;
  queue.push({ type: 'gift', ...g });

function run() {

  busy = true;
  // Si se acumulan muchas alertas, se aceleran para no quedarse atrás.
  const a = queue.shift();
  const tier = tierOf(a);
  const r = rarityOf(a);
  const botin = design() === 'botin';
  const base = Math.max(2, settings.alerts.duration || 6);
  const hurry = queue.length > 4 ? 0.5 : queue.length > 1 ? 0.75 : 1;
  let ms = (base + (botin ? [0, 1, 3, 4][r] : tier === 3 ? 3 : tier === 2 ? 1 : 0)) * 1000 * hurry;
  const rule = a.rule || findRule(a);
  const el = botin ? botinEl(a, r, rule) : classicEl(a, tier, rule);
  if (rule?.secs) ms = rule.secs * 1000 * hurry;
  stage.appendChild(el);

  if (!rule || rule.sound === 'campana') {
    playSound(tier, a.type);
    if (botin && !rule && r >= 2) boom(r);
  }
  if (botin && !rule) {
    fitName(el);
    document.fonts?.ready.then(() => el.isConnected && fitName(el));
    botinFx(el, a, r, hurry);
  } else if (tier >= 2 && rule?.size !== 'completo') confetti(tier === 3 ? 90 : 40);

  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    el.classList.add('out');
    setTimeout(() => { el.remove(); busy = false; setTimeout(run, 250); }, 520);
  };
  const video = el.querySelector('video');
  if (video && !rule.secs) {
    // El video dura lo que dure (hasta 60 s); si hay muchas alertas en fila, se corta antes.
    video.volume = Math.min(1, settings.alerts.volume ?? 0.6);
    const limit = queue.length > 4 ? 5000 : 60000;
    const t = setTimeout(finish, limit);
    video.addEventListener('ended', () => { clearTimeout(t); finish(); });
    video.addEventListener('error', () => { clearTimeout(t); setTimeout(finish, ms); });
    video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
  } else {
    if (video) {
      video.loop = true;
      video.volume = Math.min(1, settings.alerts.volume ?? 0.6);
      video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
    }
    setTimeout(finish, ms);
  }
}

function confetti(n, colors = ['#fe2c55', '#25f4ee', '#ffb547', '#b26bff', '#ffffff']) {

    c.className = 'confetti';

  }
}

      o.frequency.value = f;
      const t = now + i * 0.09;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.25 * vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + 0.65);
    });
  } catch {}
}
// Golpe grave para los regalos legendarios y míticos (cuando cae el botín).
function boom(r) {
  try {
    const ac = audio();
    if (!ac) return;
    const vol = settings.alerts.volume ?? 0.6;
    const t = ac.currentTime + 0.3;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(36, t + 0.5);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((r === 3 ? 0.6 : 0.42) * vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + 0.75);
  } catch {}
}

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Alertas</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* Opciones por URL: ?escala=1.3  ?posicion=arriba|centro|abajo  ?sonido=0
     ?vista=1 es la vista previa del panel: no recibe las alertas reales, solo las de prueba. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: 'Outfit', system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; pointer-events: none; }
  #stage.arriba { align-items: flex-start; padding-top: 8vh; }
  #stage.abajo { align-items: flex-end; padding-bottom: 10vh; }
  .alert {
    --accent: #fe2c55;
    position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;
    color: #fff; transform-origin: center; animation: pop .7s cubic-bezier(.2, 1.6, .4, 1) both;
  }
  .alert.out { animation: out .45s ease-in both; }
  @keyframes pop { from { opacity: 0; transform: scale(var(--s)) scale(.3) translateY(40px); } to { opacity: 1; transform: scale(var(--s)); } }
  @keyframes out { to { opacity: 0; transform: scale(var(--s)) scale(.85) translateY(-30px); } }

  .halo {
    position: absolute; top: 0; left: 50%; width: 300px; height: 300px; margin-left: -150px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, var(--accent), transparent 30%, #25f4ee, transparent 60%, var(--accent), transparent);
    filter: blur(28px); opacity: .55; animation: spin 4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gift-img {
    position: relative; width: 190px; height: 190px; object-fit: contain; display: grid; place-items: center;
    font-size: 130px; line-height: 1; filter: drop-shadow(0 10px 25px rgba(0,0,0,.45));
    animation: bob 1.6s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }
  .card {
    position: relative; margin-top: 10px; display: flex; align-items: center; gap: 16px;
    padding: 14px 26px 14px 14px; border-radius: 22px;
    background: rgba(15, 15, 22, .82); border: 2px solid rgba(255,255,255,.12);
    box-shadow: 0 16px 50px rgba(0,0,0,.5), 0 0 0 4px var(--accent) inset; backdrop-filter: blur(6px);
  }
  .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; background: #333; display: grid; place-items: center; font-size: 28px; font-weight: 900; flex: none; }
  .txt { text-align: left; }
  .name { font-size: 34px; font-weight: 900; line-height: 1.05; text-shadow: 0 3px 0 rgba(0,0,0,.35); max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .what { font-size: 24px; font-weight: 600; opacity: .95; margin-top: 4px; }
  .what b { color: #25f4ee; font-weight: 800; }
  .count { display: inline-block; font-weight: 900; color: var(--accent); }
  .value { font-size: 18px; opacity: .8; margin-top: 2px; }

  .alert.tier2 { --accent: #ffb547; }
  .alert.tier3 { --accent: #b26bff; }
  .alert.tier3 .gift-img { width: 240px; height: 240px; font-size: 170px; }
  .alert.follow { --accent: #25f4ee; }

  .confetti { position: fixed; top: -20px; width: 10px; height: 16px; border-radius: 2px; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div id="stage"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const params = new URLSearchParams(location.search);
const scale = Number(params.get('escala')) || 1;
const forceMute = params.get('sonido') === '0';
const PREVIEW = params.get('vista') === '1';
const stage = document.getElementById('stage');
stage.className = params.get('posicion') || 'centro';

const socket = io();
let settings = { alerts: { minDiamonds: 1, duration: 6, sound: true, volume: 0.6, showFollows: true, showShares: false } };
socket.on('config', (c) => { settings = c.settings; });

const queue = [];
let busy = false;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString('es-MX');

socket.on('gift', (g) => {
  if (PREVIEW) return;
  if (g.total < (settings.alerts.minDiamonds || 0)) return;
  queue.push({ type: 'gift', ...g });
  run();
});
socket.on('follow', (u) => { if (!PREVIEW && settings.alerts.showFollows) { queue.push({ type: 'follow', ...u }); run(); } });
socket.on('share', (u) => { if (!PREVIEW && settings.alerts.showShares) { queue.push({ type: 'share', ...u }); run(); } });

// Vista previa del panel: alertas de ejemplo que solo se ven aquí (no salen en el stream ni las lee el bot).
const SAMPLES = {
  regalo: { type: 'gift', name: 'Lupita', gift: 'Rosa', count: 5, total: 5 },
  mediano: { type: 'gift', name: 'ElPana_77', gift: 'Dona', count: 5, total: 150 },
  grande: { type: 'gift', name: 'DonCarlos', gift: 'León', count: 1, total: 29999 },
  seguidor: { type: 'follow', name: 'Sofi.gg' },
  compartido: { type: 'share', name: 'Valeria' },
};
window.preview = (kind) => {
  const a = SAMPLES[kind];
  if (!a) return;
  queue.push({ ...a, avatar: '', image: '' });
  run();
};
window.setPosition = (pos) => { stage.className = pos || 'centro'; };

function tierOf(a) {
  if (a.type !== 'gift') return 1;
  return a.total >= 1000 ? 3 : a.total >= 100 ? 2 : 1;
}

function avatarHtml(a) {
  return a.avatar
    ? `<img class="avatar" src="${esc(a.avatar)}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=avatar>${esc((a.name || '?')[0].toUpperCase())}</div>'">`
    : `<div class="avatar">${esc((a.name || '?')[0].toUpperCase())}</div>`;
}

function run() {
  if (busy || !queue.length) return;
  busy = true;
  // Si se acumulan muchas alertas, se aceleran para no quedarse atrás.
  const a = queue.shift();
  const tier = tierOf(a);
  const base = Math.max(2, settings.alerts.duration || 6);
  const hurry = queue.length > 4 ? 0.5 : queue.length > 1 ? 0.75 : 1;
  const ms = (base + (tier === 3 ? 3 : tier === 2 ? 1 : 0)) * 1000 * hurry;

  const el = document.createElement('div');
  el.className = `alert tier${tier} ${a.type}`;
  el.style.setProperty('--s', scale);
  let visual, what, value = '';
  if (a.type === 'gift') {
    visual = a.image
      ? `<img class="gift-img" src="${esc(a.image)}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=gift-img>🎁</div>'">`
      : `<div class="gift-img">🎁</div>`;
    what = `envió <span class="count">${a.count}×</span> <b>${esc(a.gift)}</b>`;
    if (a.total) value = `${fmt(a.total)} 💎`;
  } else if (a.type === 'follow') {
    visual = `<div class="gift-img">💖</div>`;
    what = `¡te empezó a <b>seguir</b>!`;
  } else {
    visual = `<div class="gift-img">📢</div>`;
    what = `¡<b>compartió</b> el live!`;
  }
  el.innerHTML = `<div class="halo"></div>${visual}
    <div class="card">${avatarHtml(a)}<div class="txt"><div class="name">${esc(a.name)}</div><div class="what">${what}</div>${value ? `<div class="value">${value}</div>` : ''}</div></div>`;
  stage.appendChild(el);

  playSound(tier, a.type);
  if (tier >= 2) confetti(tier === 3 ? 90 : 40);

  setTimeout(() => el.classList.add('out'), ms);
  setTimeout(() => { el.remove(); busy = false; setTimeout(run, 250); }, ms + 450);
}

function confetti(n) {
  const colors = ['#fe2c55', '#25f4ee', '#ffb547', '#b26bff', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2.2 + Math.random() * 2.2 + 's';
    c.style.animationDelay = Math.random() * 0.6 + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5200);
  }
}

// Sonido generado (no necesita archivos de audio).
let ctx;
function playSound(tier, type) {
  if (forceMute || !settings.alerts.sound) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const vol = settings.alerts.volume ?? 0.6;
    const notes = type !== 'gift' ? [659, 880] : tier === 3 ? [523, 659, 784, 1047, 1319] : tier === 2 ? [587, 740, 880, 1175] : [784, 1047];
    const now = ctx.currentTime;
    notes.forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = i % 2 ? 'triangle' : 'sine';
      o.frequency.value = f;
      const t = now + i * 0.09;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.25 * vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + 0.65);
    });
  } catch {}
}
</script>
</body>
</html>

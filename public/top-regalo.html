<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Regalo más caro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fx.css">
<style>
  /* El estilo se elige en el panel (Overlays). Opciones por URL que mandan sobre el panel:
     ?estilo=tarjeta|banner|trofeo|neon|minimal|burbuja|circulo|cuadro  ?cambio=4 (segundos, estilos Círculo y Cuadro)  ?titulo=Rey%20del%20stream (?titulo=0 sin título)  ?fondo=0  ?escala=1.2  ?ocultarVacio=1  ?demo=1  ?animacion=0 */
  .fxw { display: block; }
  :root { --gold: #ffc24b; --gold2: #ffe17a; --pink: #fe2c55; --cyan: #25f4ee; }
  html, body { margin: 0; background: transparent; font-family: 'Outfit', system-ui, sans-serif; color: #fff; overflow: hidden; }
  .stage { display: inline-block; transform-origin: top left; padding: 18px 12px 12px; }
  .hidden { display: none; }
  .sh { text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .av { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #3a3348; display: grid; place-items: center; font-size: 13px; font-weight: 900; border: 2px solid #fff; flex: none; }
  .gimg { display: grid; place-items: center; position: relative; flex: none; }
  .gimg img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 18px rgba(0,0,0,.5)); }
  .fx-on .float img { animation: bob calc(2.4s * var(--spd)) ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg); } }
  .badge { position: absolute; z-index: 3; padding: 5px 14px; border-radius: 999px; font-weight: 900; font-size: 15px; color: #2a1700; white-space: nowrap;
    background: linear-gradient(90deg, var(--gold2), #ffb547); box-shadow: 0 6px 18px rgba(255,181,71,.45); opacity: 0; transform: scale(.6); pointer-events: none; }
  .record .badge { animation: badge 6s ease forwards; }
  @keyframes badge { 0% { opacity: 0; transform: scale(.6); } 8% { opacity: 1; transform: scale(1.12); } 14% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
  .enter { animation: enter .6s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes enter { from { opacity: 0; transform: scale(.7) translateY(20px); } }
  .spark { position: fixed; width: 8px; height: 8px; border-radius: 50%; background: #ffd56b; pointer-events: none; animation: spark 1.1s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

  /* ---------- TARJETA ---------- */
  .tarjeta .card { position: relative; display: flex; align-items: center; gap: 18px; padding: 16px 26px 16px 16px; min-width: 380px; border-radius: 24px;
    background: rgba(14,12,20,.82); border: 2px solid rgba(255,194,75,.55); box-shadow: 0 14px 44px rgba(0,0,0,.5); }
  .tarjeta .gimg { width: 110px; height: 110px; font-size: 74px; }
  .tarjeta .gimg::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(circle, rgba(255,194,75,.45), transparent 70%); z-index: -1; }
  .tarjeta .t { font-size: 15px; font-weight: 700; color: var(--gold); }
  .tarjeta .n { font-size: 30px; font-weight: 900; line-height: 1.05; margin: 2px 0 4px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tarjeta .v { font-size: 22px; font-weight: 900; color: var(--gold); }
  .tarjeta .f { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 17px; font-weight: 700; }
  .tarjeta .badge { top: -14px; right: 18px; }
  .record.tarjeta .card { animation: pulse 1.4s ease-out 3; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,194,75,.8), 0 14px 44px rgba(0,0,0,.5); } 100% { box-shadow: 0 0 0 30px rgba(255,194,75,0), 0 14px 44px rgba(0,0,0,.5); } }

  /* ---------- BANNER (barra horizontal delgada) ---------- */
  .banner .card { position: relative; display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 22px 0 8px; border-radius: 999px; min-width: 520px;
    background: linear-gradient(90deg, #ffb547, #ff7a2e 55%, #fe2c55); box-shadow: 0 10px 30px rgba(254,44,85,.35); }
  .banner .gimg { width: 56px; height: 56px; font-size: 38px; background: rgba(255,255,255,.22); border-radius: 50%; }
  .banner .gimg img { width: 84%; height: 84%; }
  .banner .t { font-size: 13px; font-weight: 900; opacity: .9; color: #2a1200; }
  .banner .line { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  .banner .n { font-size: 22px; font-weight: 900; }
  .banner .v { font-size: 20px; font-weight: 900; color: #fff7d6; }
  .banner .f { margin-left: auto; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; padding-left: 16px; border-left: 2px solid rgba(255,255,255,.4); white-space: nowrap; }
  .banner .badge { top: -16px; left: 70px; }
  .nobg .banner .card { background: none; box-shadow: none; }

  /* ---------- TROFEO (vertical, ideal para stream vertical) ---------- */
  .trofeo .card { position: relative; width: 260px; padding: 22px 18px 18px; border-radius: 28px; text-align: center;
    background: linear-gradient(180deg, rgba(60,40,10,.92), rgba(14,12,20,.9)); border: 2px solid rgba(255,194,75,.7); box-shadow: 0 0 40px rgba(255,194,75,.25), 0 16px 40px rgba(0,0,0,.5); }
  .trofeo .crown { font-size: 34px; line-height: 1; }
  .trofeo .t { font-size: 14px; font-weight: 800; color: var(--gold); letter-spacing: .3px; margin-top: 2px; }
  .trofeo .gimg { width: 150px; height: 150px; font-size: 100px; margin: 8px auto 6px; }
  .trofeo .gimg::after { content: ''; position: absolute; left: 15%; right: 15%; bottom: -4px; height: 14px; border-radius: 50%; background: radial-gradient(rgba(255,194,75,.55), transparent 70%); }
  .trofeo .n { font-size: 28px; font-weight: 900; line-height: 1.05; }
  .trofeo .v { display: inline-block; margin: 8px 0 12px; padding: 5px 14px; border-radius: 999px; background: rgba(255,194,75,.18); color: var(--gold2); font-size: 20px; font-weight: 900; }
  .trofeo .f { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 800; }
  .trofeo .badge { top: -16px; left: 50%; transform: translateX(-50%) scale(.6); }
  .record.trofeo .badge { animation: badgeC 6s ease forwards; }
  @keyframes badgeC { 0% { opacity: 0; transform: translateX(-50%) scale(.6); } 8% { opacity: 1; transform: translateX(-50%) scale(1.12); } 14% { transform: translateX(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
  .nobg .trofeo .card { background: none; border: 0; box-shadow: none; }

  /* ---------- NEÓN ---------- */
  .neon .card { position: relative; display: flex; align-items: center; gap: 18px; padding: 18px 26px 18px 18px; min-width: 380px; border-radius: 18px;
    background: rgba(5,3,12,.86); border: 2px solid var(--pink); box-shadow: 0 0 18px rgba(254,44,85,.7), inset 0 0 18px rgba(254,44,85,.3); }
  .neon .gimg { width: 96px; height: 96px; font-size: 64px; filter: drop-shadow(0 0 12px rgba(37,244,238,.8)); }
  .neon .t { font-family: 'Bungee', sans-serif; font-size: 14px; color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  .neon .n { font-family: 'Bungee', sans-serif; font-size: 26px; line-height: 1.1; margin: 4px 0; text-shadow: 0 0 6px #fff, 0 0 16px var(--pink), 0 0 30px var(--pink); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .neon .v { font-size: 22px; font-weight: 900; color: #ffe0a0; text-shadow: 0 0 10px var(--gold); }
  .neon .f { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 17px; font-weight: 700; text-shadow: 0 0 8px rgba(255,255,255,.6); }
  .neon .av { border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .neon .badge { top: -14px; right: 18px; background: var(--cyan); color: #04201f; box-shadow: 0 0 18px var(--cyan); }
  .record.neon .card { animation: flick 1.2s steps(2) 3; }
  @keyframes flick { 50% { box-shadow: 0 0 40px rgba(254,44,85,1), inset 0 0 30px rgba(254,44,85,.6); } }
  .nobg .neon .card { background: none; }

  /* ---------- MINIMAL (solo texto) ---------- */
  .minimal .card { position: relative; display: flex; align-items: center; gap: 12px; padding: 4px; }
  .minimal .gimg { width: 58px; height: 58px; font-size: 44px; }
  .minimal .t { font-size: 13px; font-weight: 800; color: var(--gold); text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  .minimal .n { font-size: 22px; font-weight: 900; text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9); }
  .minimal .n span { color: var(--gold); }
  .minimal .f { font-size: 15px; font-weight: 700; opacity: .95; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  .minimal .badge { top: -18px; left: 0; font-size: 12px; padding: 3px 10px; }

  /* ---------- BURBUJA (foto de quien lo mandó) ---------- */
  .burbuja .card { position: relative; display: flex; align-items: center; gap: 16px; padding: 10px 26px 10px 10px; border-radius: 999px; min-width: 360px;
    background: rgba(14,12,20,.82); border: 2px solid rgba(255,255,255,.14); box-shadow: 0 12px 34px rgba(0,0,0,.45); }
  .burbuja .who { position: relative; flex: none; }
  .burbuja .who .av { width: 92px; height: 92px; font-size: 36px; border: 4px solid var(--gold); }
  .burbuja .who .gimg { position: absolute; right: -10px; bottom: -6px; width: 50px; height: 50px; font-size: 32px; background: #1d1729; border-radius: 50%; border: 3px solid var(--gold); }
  .burbuja .who .gimg img { width: 80%; height: 80%; }
  .burbuja .t { font-size: 14px; font-weight: 700; color: var(--gold); }
  .burbuja .n { font-size: 28px; font-weight: 900; line-height: 1.05; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .burbuja .v { font-size: 18px; font-weight: 800; opacity: .95; }
  .burbuja .v b { color: var(--gold); }
  .burbuja .badge { top: -14px; left: 110px; }
  .nobg .burbuja .card { background: none; border: 0; box-shadow: none; }

  /* Con animaciones apagadas se respeta "reducir movimiento" de Windows. */
  /* ---------- CÍRCULO (alterna foto de perfil y regalo, como moneda) ---------- */
  .circulo .fxw { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 300px; padding-top: 4px; }
  .circulo .t { font-size: 14px; font-weight: 800; color: var(--gold); padding: 5px 14px; border-radius: 999px; background: rgba(14,12,20,.82); white-space: nowrap; }
  .circulo .card { position: relative; width: 200px; height: 200px; border-radius: 50%; border: 5px solid var(--gold); perspective: 900px; background: #120d18;
    box-shadow: 0 0 34px rgba(255,194,75,.45), 0 16px 40px rgba(0,0,0,.5); }
  .circulo .faces { position: absolute; inset: 0; border-radius: 50%; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.45,1.45,.5,1); }
  .circulo .card.flipped .faces { transform: rotateY(180deg); }
  .circulo .face { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .circulo .face.front { background: linear-gradient(135deg, #fe2c55, #7a3cff); }
  .circulo .face.front img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .circulo .face.front .letter { font-size: 92px; font-weight: 900; text-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .circulo .face.back { transform: rotateY(180deg); background: radial-gradient(circle at 50% 42%, #6b4510, #2a1c0c 55%, #120d18); }
  .circulo .gimg { width: 140px; height: 140px; font-size: 96px; }
  .circulo .info { text-align: center; padding: 8px 18px 10px; border-radius: 18px; background: rgba(14,12,20,.82); border: 2px solid rgba(255,194,75,.45); max-width: 300px; box-sizing: border-box; }
  .circulo .n { font-size: 24px; font-weight: 900; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .circulo .v { font-size: 17px; font-weight: 800; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .circulo .v b { color: var(--gold); }
  .circulo .badge { top: auto; bottom: -14px; left: 50%; transform: translateX(-50%) scale(.6); }
  .record.circulo .badge { animation: badgeC 6s ease forwards; }
  .record.circulo .card { animation: pulseC 1.4s ease-out 3; }
  @keyframes pulseC { 0% { box-shadow: 0 0 0 0 rgba(255,194,75,.8), 0 16px 40px rgba(0,0,0,.5); } 100% { box-shadow: 0 0 0 34px rgba(255,194,75,0), 0 16px 40px rgba(0,0,0,.5); } }
  /* CUADRO: lo mismo que Círculo pero con esquinas redondeadas */
  .cuadro .card { border-radius: 30px; }
  .cuadro .faces, .cuadro .face { border-radius: 25px; }
  .nobg .circulo .t, .nobg .circulo .info { background: none; border-color: transparent; text-shadow: 0 2px 6px rgba(0,0,0,.9); }

  @media (prefers-reduced-motion: reduce) { body:not(.fx-on) * { animation: none !important; } body:not(.fx-on) .record .badge { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="stage" id="stage"><div id="root"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/gifts.js"></script>
<script src="/text-style.js"></script>
<script src="/fx.js"></script>
<script>
const P = new URLSearchParams(location.search);
const stage = document.getElementById('stage');
const root = document.getElementById('root');
const STYLES = ['tarjeta', 'banner', 'trofeo', 'neon', 'minimal', 'burbuja', 'circulo', 'cuadro'];
let cfg = { style: 'tarjeta', title: 'Regalo más caro del stream', showTitle: true, bg: true, swap: 4, anim: { on: true, idle: 'brillo', change: 'pop', intensity: 'normal', counters: true } };
let record = null;
let demoGift = null; // regalo de prueba del botón "Probar animación"
const DEMO_GIFTS = [
  { user: 'lupita', name: 'Lupita', avatar: '', gift: 'Universo', image: '', diamonds: 34999, count: 1 },
  { user: 'doncarlos', name: 'DonCarlos', avatar: '', gift: 'Fénix', image: '', diamonds: 41999, count: 1 },
];
let lastKey = '';
const DEMO = { user: 'elpana77', name: 'ElPana_77', avatar: '', gift: 'León', image: '', diamonds: 29999, count: 1, total: 29999, ts: Date.now() };

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const full = (n) => Number(n).toLocaleString('es-MX');

function settings() {
  const s = { ...cfg };
  if (P.get('estilo') && STYLES.includes(P.get('estilo'))) s.style = P.get('estilo');
  if (s.showTitle === false) s.title = '';
  if (P.get('titulo') !== null) s.title = P.get('titulo') === '0' ? '' : P.get('titulo');
  if (P.get('fondo') === '0') s.bg = false;
  if (Number(P.get('cambio'))) s.swap = Number(P.get('cambio'));
  s.swap = Math.max(2, Math.min(30, Number(s.swap) || 4));
  if (!STYLES.includes(s.style)) s.style = 'tarjeta';
  s.title = String(s.title || '').trim();
  return s;
}

function render(isRecord = false) {
  const s = settings();
  const g = demoGift || record || (P.get('demo') === '1' ? DEMO : null);
  document.body.classList.toggle('nobg', !s.bg);
  stage.style.transform = `scale(${Number(P.get('escala')) || 1})`;
  stage.classList.toggle('hidden', !g && P.get('ocultarVacio') === '1');
  const flip = s.style === 'circulo' || s.style === 'cuadro';
  root.className = s.style === 'cuadro' ? 'circulo cuadro' : s.style;

  const letter = esc(((g?.name || '?')[0] || '?').toUpperCase());
  const av = g?.avatar ? `<img class="av" src="${esc(g.avatar)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=av>${letter}</span>'">` : `<span class="av">${letter}</span>`;
  const emo = g ? giftEmoji(g.gift) : '🎁';
  const img = g?.image ? `<img src="${esc(g.image)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${emo}'))">` : emo;
  const gift = g ? `<span class="tx-gift">${esc(g.gift)}${g.count > 1 ? ` ×${g.count}` : ''}</span>` : '';
  const val = g ? `<span class="tx-value"><span class="cnt">${full(g.diamonds)}</span> 💎</span>` : '';
  const nm = g ? `<span class="tx-name">${esc(g.name)}</span>` : '';
  const T = esc(s.title);
  const badge = '<span class="badge">¡Nuevo récord!</span>';

  if (!g) {
    const msg = '¡Sé el primero en mandar un regalo!';
    root.innerHTML = flip
      ? `<div class="fxw"><div class="t">${T}</div><div class="card"><div class="faces"><div class="face back" style="transform:none"><div class="gimg">🎁</div></div></div></div><div class="info"><div class="v" style="white-space:normal">${msg}</div></div></div>`
      : s.style === 'banner'
      ? `<div class="card"><div class="gimg">🎁</div><div><div class="t">${T}</div><div class="line"><span class="n">${msg}</span></div></div></div>`
      : s.style === 'trofeo'
        ? `<div class="card"><div class="crown">👑</div><div class="t">${T}</div><div class="gimg">🎁</div><div class="n" style="font-size:20px">${msg}</div></div>`
        : `<div class="card"><div class="gimg">🎁</div><div><div class="t sh">${T}</div><div class="n sh" style="font-size:20px">${msg}</div></div></div>`;
    root.innerHTML = noTitle(root.innerHTML);
    lastKey = '';
    FX.decorate(root.querySelector('.card'));
    FX.sync(root);
    return;
  }

  const key = `${g.ts}-${g.user}-${g.gift}`;
  if (key !== lastKey) { side = 'foto'; swapLoop(); } // regalo nuevo: en el estilo Círculo primero se ve la foto
  const html = {
    tarjeta: `<div class="card">${badge}<div class="gimg float">${img}</div><div><div class="t sh">${T}</div><div class="n sh">${gift}</div><div class="v sh">${val}</div><div class="f sh">${av}${nm}</div></div></div>`,
    banner: `<div class="card">${badge}<div class="gimg">${img}</div><div><div class="t">${T}</div><div class="line"><span class="n sh">${gift}</span><span class="v sh">${val}</span></div></div><div class="f sh">${av}${nm}</div></div>`,
    trofeo: `<div class="card">${badge}<div class="crown">👑</div><div class="t">${T}</div><div class="gimg float">${img}</div><div class="n sh">${gift}</div><div class="v">${val}</div><div class="f sh">${av}${nm}</div></div>`,
    neon: `<div class="card">${badge}<div class="gimg float">${img}</div><div><div class="t">${T}</div><div class="n">${gift}</div><div class="v">${val}</div><div class="f">${av}${nm}</div></div></div>`,
    minimal: `<div class="card">${badge}<div class="gimg">${img}</div><div><div class="t">${T}</div><div class="n">${gift} <span>${val}</span></div><div class="f">de ${nm}</div></div></div>`,
    circulo: `<div class="t">${T}</div><div class="card ${side === 'regalo' ? 'flipped' : ''}">${badge}<div class="faces"><div class="face front">${face(g)}</div><div class="face back"><div class="gimg float">${img}</div></div></div></div><div class="info"><div class="n sh">${nm}</div><div class="v sh">${gift} · <b>${val}</b></div></div>`,
    burbuja: `<div class="card">${badge}<div class="who">${av}<div class="gimg">${img}</div></div><div><div class="t sh">${T}</div><div class="n sh">${nm}</div><div class="v sh">mandó ${gift} · <b>${val}</b></div></div></div>`,
  }[s.style === 'cuadro' ? 'circulo' : s.style];
  root.innerHTML = `<div class="fxw">${noTitle(html)}</div>`;

  const card = root.querySelector('.card');
  FX.decorate(card);
  if (key !== lastKey) FX.reset('diamantes'); // regalo nuevo: los diamantes cuentan desde 0
  FX.count(root.querySelector('.cnt'), 'diamantes', g.diamonds, full);
  if (key !== lastKey) {
    if (FX.on) FX.change(root.querySelector('.fxw'), 'regalo');
    else card.classList.add('enter');
  }
  FX.sync(root);
  if (isRecord) {
    root.classList.add('record');
    sparks(card);
    clearTimeout(render.t);
    render.t = setTimeout(() => root.classList.remove('record'), 6500);
  }
  lastKey = key;
}

// Sin título: se quita su renglón para que no deje hueco.
const noTitle = (html) => html.replace(/<div class="t( sh)?"><\/div>/g, '');

// Estilo Círculo: la cara de la foto (o la inicial si no hay foto).
let side = 'foto';
function face(g) {
  const letter = esc(((g.name || '?')[0] || '?').toUpperCase());
  return g.avatar
    ? `<img src="${esc(g.avatar)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=letter>${letter}</span>'">`
    : `<span class="letter">${letter}</span>`;
}
// Voltea entre foto y regalo cada tantos segundos (siempre, aunque las animaciones estén apagadas:
// es la forma de este estilo de mostrar las dos cosas).
function swapLoop() {
  clearTimeout(swapLoop.t);
  swapLoop.t = setTimeout(() => {
    const card = root.querySelector('.circulo .card');
    if (card && card.querySelector('.face.front')) {
      side = side === 'foto' ? 'regalo' : 'foto';
      card.classList.toggle('flipped', side === 'regalo');
    }
    swapLoop();
  }, settings().swap * 1000);
}
swapLoop();

function sparks(card) {
  const r = card.getBoundingClientRect();
  const cx = r.left + Math.min(80, r.width / 2), cy = r.top + r.height / 2;
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    const ang = (Math.PI * 2 * i) / 26, dist = 60 + Math.random() * 90;
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

// Botón "Probar animación" del panel: simula un récord nuevo y luego vuelve a lo real.
window.fxDemo = () => {
  const i = (fxDemo.n = ((fxDemo.n ?? -1) + 1)) % DEMO_GIFTS.length;
  demoGift = { ...DEMO_GIFTS[i], ts: Date.now() };
  demoGift.total = demoGift.diamonds * demoGift.count;
  render(true);
  clearTimeout(fxDemo.t);
  fxDemo.t = setTimeout(() => { demoGift = null; render(); }, 7000);
};

function applyFx() {
  const a = { ...cfg.anim };
  if (P.get('animacion') === '0') a.on = false;
  FX.apply(a);
}

const socket = io();
socket.on('config', (c) => { cfg = { ...cfg, ...(c.settings?.overlays?.topGift || {}) }; applyFx(); applyTextStyle(cfg.text); render(); });
socket.on('topGifts', ({ list, record: isNew }) => { record = (list || [])[0] || null; render(!!isNew); });
applyFx();
render();
</script>

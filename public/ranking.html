<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Top taps</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fx.css">
<style>
  /* El estilo se elige en el panel (Overlays). Opciones por URL que mandan sobre el panel:
     ?tipo=likes|regalos  ?estilo=lista|podio|lider|compacto|neon|cinta|bolitas  ?top=5  ?titulo=Mis%20fans (?titulo=0 sin título)  ?fondo=0  ?escala=1.2  ?demo=1  ?animacion=0 */
  :root { --acc: #fe2c55; --acc2: #25f4ee; --gold: #ffc24b; }
  html, body { margin: 0; background: transparent; font-family: 'Outfit', system-ui, sans-serif; color: #fff; overflow: hidden; }
  .stage { display: inline-block; transform-origin: top left; padding: 10px; }
  .av { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #3a3348; display: grid; place-items: center; font-weight: 900; flex: none; border: 2px solid rgba(255,255,255,.75); }
  .shadow { text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .empty { opacity: .8; font-size: 16px; padding: 6px 4px; }
  .bump { animation: bump .5s ease; }
  @keyframes bump { 40% { transform: scale(1.06); } }

  /* ---------- LISTA (clásico) ---------- */
  .lista .box { min-width: 340px; padding: 16px 16px 12px; border-radius: 22px; background: rgba(12,12,18,.78); border: 2px solid rgba(255,255,255,.1); box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  .nobg .lista .box, .nobg .compacto .box, .nobg .lider .box, .nobg .podio .box { background: none; border: 0; box-shadow: none; }
  .lista h1 { margin: 0 0 12px; font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
  .lista h1::after { content: ''; flex: 1; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--acc2), var(--acc)); }
  .lista ol { list-style: none; margin: 0; padding: 0; }
  .lista li { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; margin-bottom: 8px; border-radius: 16px; background: rgba(255,255,255,.07); transition: transform .45s cubic-bezier(.2,.9,.3,1.2); }
  .lista .pos { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: rgba(255,255,255,.12); flex: none; }
  .lista li:nth-child(1) .pos, .compacto li:nth-child(1) .pos { background: linear-gradient(135deg, #ffe17a, #f2a614); color: #3b2500; }
  .lista li:nth-child(2) .pos, .compacto li:nth-child(2) .pos { background: linear-gradient(135deg, #f1f4f8, #a9b3c1); color: #222; }
  .lista li:nth-child(3) .pos, .compacto li:nth-child(3) .pos { background: linear-gradient(135deg, #f0b58a, #b0672d); color: #2c1300; }
  .lista .nm { flex: 1; font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .lista .v { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }

  /* ---------- PODIO (top 3 en escalones) ---------- */
  .podio .box { padding: 16px 18px 0; border-radius: 24px; background: rgba(12,12,18,.78); border: 2px solid rgba(255,255,255,.1); }
  .podio h1 { margin: 0 0 10px; font-size: 22px; font-weight: 900; text-align: center; }
  .podio .stand { display: flex; align-items: flex-end; gap: 10px; }
  .podio .col { width: 128px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .podio .col .av { width: 64px; height: 64px; font-size: 24px; margin-bottom: 6px; }
  .podio .col.p1 .av { width: 84px; height: 84px; border-color: var(--gold); box-shadow: 0 0 24px rgba(255,194,75,.6); }
  .podio .crown { font-size: 26px; height: 30px; }
  .podio .nm { font-weight: 800; font-size: 17px; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .podio .v { font-weight: 900; font-size: 16px; color: var(--gold); margin-bottom: 8px; }
  .podio .step { width: 100%; border-radius: 14px 14px 0 0; display: grid; place-items: center; font-size: 34px; font-weight: 900; color: rgba(255,255,255,.95); }
  .podio .p1 .step { height: 110px; background: linear-gradient(180deg, #ffd76a, #d98d0b); }
  .podio .p2 .step { height: 80px; background: linear-gradient(180deg, #e7ecf3, #8f9aab); color: #2a2f38; }
  .podio .p3 .step { height: 60px; background: linear-gradient(180deg, #f0b58a, #a65e25); }
  .podio .rest { display: flex; gap: 14px; justify-content: center; padding: 10px 0 12px; font-size: 14px; font-weight: 700; opacity: .9; }

  /* ---------- LÍDER (solo el #1 en grande) ---------- */
  .lider .box { display: flex; align-items: center; gap: 18px; padding: 16px 26px 16px 16px; border-radius: 26px; min-width: 380px; background: linear-gradient(120deg, rgba(254,44,85,.9), rgba(120,40,200,.85)); box-shadow: 0 14px 44px rgba(0,0,0,.45); }
  .lider .av { width: 92px; height: 92px; font-size: 34px; border: 4px solid #fff; }
  .lider .crown { position: absolute; top: -22px; left: 26px; font-size: 34px; transform: rotate(-14deg); }
  .lider .who { position: relative; }
  .lider small { display: block; font-size: 15px; font-weight: 700; opacity: .9; }
  .lider b { display: block; font-size: 32px; font-weight: 900; line-height: 1.05; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lider .v { font-size: 24px; font-weight: 900; }
  .lider .next { font-size: 14px; opacity: .85; margin-top: 4px; }

  /* ---------- COMPACTO (fila mínima) ---------- */
  .compacto .box { padding: 10px; border-radius: 16px; background: rgba(12,12,18,.72); min-width: 250px; }
  .compacto h1 { margin: 0 4px 6px; font-size: 15px; font-weight: 800; opacity: .9; }
  .compacto ol { list-style: none; margin: 0; padding: 0; }
  .compacto li { display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 16px; font-weight: 700; }
  .compacto .pos { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; font-weight: 900; background: rgba(255,255,255,.14); }
  .compacto .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .compacto .v { font-variant-numeric: tabular-nums; font-weight: 900; }

  /* ---------- NEÓN ---------- */
  .neon .box { min-width: 340px; padding: 18px; border-radius: 18px; background: rgba(5,3,12,.86); border: 2px solid var(--acc2); box-shadow: 0 0 18px rgba(37,244,238,.6), inset 0 0 18px rgba(37,244,238,.25); }
  .nobg .neon .box { background: none; box-shadow: none; }
  .neon h1 { margin: 0 0 12px; font-family: 'Bungee', 'Outfit', sans-serif; font-size: 22px; font-weight: 400; color: #fff; text-shadow: 0 0 6px #fff, 0 0 14px var(--acc), 0 0 28px var(--acc); letter-spacing: 1px; }
  .neon ol { list-style: none; margin: 0; padding: 0; }
  .neon li { display: flex; align-items: center; gap: 12px; padding: 7px 4px; border-bottom: 1px solid rgba(37,244,238,.25); }
  .neon li:last-child { border-bottom: 0; }
  .neon .pos { font-family: 'Bungee', sans-serif; font-size: 22px; width: 32px; color: var(--acc2); text-shadow: 0 0 10px var(--acc2); }
  .neon .av { width: 36px; height: 36px; border-color: var(--acc2); box-shadow: 0 0 10px var(--acc2); }
  .neon .nm { flex: 1; font-size: 19px; font-weight: 700; text-shadow: 0 0 8px rgba(255,255,255,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
  .neon .v { font-size: 19px; font-weight: 900; color: #ff8fb0; text-shadow: 0 0 10px var(--acc); }

  /* ---------- CINTA (barra que se desplaza) ---------- */
  .cinta .box { display: flex; align-items: center; width: var(--w, 900px); height: 54px; border-radius: 999px; overflow: hidden; background: rgba(12,12,18,.85); border: 2px solid rgba(255,255,255,.12); }
  .nobg .cinta .box { background: none; border: 0; }
  .cinta .tag { flex: none; height: 100%; display: grid; place-items: center; padding: 0 18px; font-weight: 900; font-size: 18px; background: linear-gradient(90deg, var(--acc), #ff6a3d); border-radius: 999px; z-index: 1; }
  .cinta .track { flex: 1; overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
  .cinta .run { display: inline-flex; gap: 36px; padding-left: 24px; white-space: nowrap; animation: run var(--dur, 20s) linear infinite; }
  .cinta .it { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; }
  .cinta .it .av { width: 30px; height: 30px; font-size: 13px; }
  .cinta .it em { font-style: normal; color: var(--gold); }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  /* ---------- BOLITAS (vertical: fotos en círculo, una debajo de otra) ---------- */
  .bolitas .box { width: 210px; padding: 14px 10px 16px; border-radius: 30px; background: rgba(12,12,18,.72); border: 2px solid rgba(255,255,255,.1); box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  .nobg .bolitas .box { background: none; border: 0; box-shadow: none; }
  .bolitas h1 { margin: 0 0 12px; font-size: 19px; font-weight: 900; text-align: center; }
  .bolitas ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .bolitas li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; border-radius: 20px; }
  .bolitas .orb { position: relative; width: 76px; height: 76px; --c1: #fe2c55; --c2: #25f4ee; }
  .bolitas li:nth-child(1) .orb { width: 116px; height: 116px; --c1: #ffe17a; --c2: #f2a614; margin-top: 24px; }
  .bolitas li:nth-child(2) .orb { width: 92px; height: 92px; --c1: #ffffff; --c2: #8f9aab; }
  .bolitas li:nth-child(3) .orb { width: 92px; height: 92px; --c1: #f6c29a; --c2: #a65e25; }
  .bolitas .ring { position: absolute; inset: -5px; border-radius: 50%; background: conic-gradient(from var(--fx-a), var(--c1), var(--c2), var(--c1), var(--c2), var(--c1)); }
  .fx-on .bolitas .ring { animation: fx-spin calc(3s * var(--spd)) linear infinite; }
  .bolitas li:nth-child(1) .ring { box-shadow: 0 0 22px rgba(255,194,75,.6); }
  .fx-on .bolitas li:nth-child(1) .ring { animation: fx-spin calc(3s * var(--spd)) linear infinite, orbGlow calc(2s * var(--spd)) ease-in-out infinite; }
  @keyframes orbGlow { 50% { box-shadow: 0 0 calc(30px + 10px * var(--amp)) rgba(255,194,75,.95); } }
  .bolitas .pic { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; border: 3px solid #120d18; background: #2a2238; }
  .bolitas .pic .av { width: 100%; height: 100%; border: 0; border-radius: 50%; font-size: 32px; background: linear-gradient(135deg, #fe2c55, #7a3cff); }
  .bolitas li:nth-child(1) .pic .av { font-size: 48px; }
  .bolitas .pos { position: absolute; right: -4px; bottom: -2px; z-index: 2; min-width: 26px; height: 26px; padding: 0 5px; box-sizing: border-box; border-radius: 999px;
    display: grid; place-items: center; font-weight: 900; font-size: 14px; color: #1a1222; background: linear-gradient(135deg, var(--c1), var(--c2)); border: 2px solid #120d18; }
  .bolitas .crown { position: absolute; top: -32px; left: 50%; translate: -50% 0; z-index: 2; font-size: 32px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
  .bolitas .lbl { text-align: center; line-height: 1.15; max-width: 190px; }
  .bolitas .nm { display: block; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bolitas li:nth-child(1) .nm { font-size: 19px; }
  .bolitas .v { display: inline-block; font-size: 14px; font-weight: 900; color: var(--gold); }
  .bolitas .orb.tap { animation: orbTap .35s ease; }
  /* Quien sube de puesto: brilla su aro en verde en lugar de toda la fila */
  .bolitas li.fx-up::after { display: none; }
  .bolitas li.fx-up .ring { outline: 3px solid #4fe0b6; outline-offset: 2px; filter: drop-shadow(0 0 12px rgba(79,224,182,.9)); }
  .bolitas .fx-arrow { right: calc(50% - 60px); top: -4px; }
  .bolitas li:nth-child(1) .fx-arrow { right: calc(50% - 72px); top: 16px; }
  @keyframes orbTap { 40% { scale: calc(1 + .08 * var(--amp)); } }
  /* Corazones (o diamantes) que salen de la foto de quien da taps */
  .tapfx { position: fixed; z-index: 60; pointer-events: none; font-size: calc(14px + 6px * var(--amp)); animation: tapfx calc(1.2s * var(--spd)) ease-out both; }
  @keyframes tapfx { 0% { opacity: 0; transform: translate(0, 0) scale(.4); } 15% { opacity: 1; transform: translate(calc(var(--dx) * .2), -10px) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), -70px) scale(.8) rotate(var(--r)); } }
  body.fx-on .cinta .box { position: relative; }
  .podio .col, .lider .box { position: relative; }
  body.fx-on .fx-tick { animation: fx-tick .42s ease; }
  @keyframes fx-tick { 40% { scale: calc(1 + .16 * var(--amp)); } }
  .fx-on .podio .crown, .fx-on .lider .crown { display: inline-block; animation: crown calc(2.6s * var(--spd)) ease-in-out infinite; }
  @keyframes crown { 0%, 100% { translate: 0 0; } 50% { translate: 0 calc(-4px * var(--amp)); } }
  @media (prefers-reduced-motion: reduce) { body:not(.fx-on) .cinta .run { animation: none; } }
</style>
</head>
<body>
<div class="stage" id="stage"><div id="root"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/fx.js"></script>
<script src="/text-style.js"></script>
<script>
const P = new URLSearchParams(location.search);
const tipo = /regal|gift/i.test(P.get('tipo') || '') ? 'gifts' : 'likes';
const icon = tipo === 'gifts' ? '💎' : '❤️';
const stage = document.getElementById('stage');
const root = document.getElementById('root');
const STYLES = ['lista', 'podio', 'lider', 'compacto', 'neon', 'cinta', 'bolitas'];
let cfg = { style: 'lista', title: tipo === 'gifts' ? '💎 Top regalos' : '❤️ Top taps', showTitle: true, top: 5, bg: true, anim: { on: true, idle: 'ola', change: 'pop', intensity: 'normal', counters: true, rankUp: true } };
let last = null;
let prev = new Map();   // usuario -> { value, pos } de la vez anterior
let lastKey = '';       // qué hay dibujado (si no cambia, solo se actualizan los números)
let override = null;    // filas de prueba del botón "Probar animación"

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1).replace('.0', '') + 'K' : Number(n).toLocaleString('es-MX');
const av = (u) => u.avatar
  ? `<img class="av" src="${esc(u.avatar)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=av>${esc((u.name || '?')[0].toUpperCase())}</span>'">`
  : `<span class="av">${esc((u.name || '?')[0].toUpperCase())}</span>`;

const DEMO = [['Lupita', 1240], ['ElPana_77', 980], ['Sofi.gg', 640], ['DonCarlos', 410], ['Valeria', 220], ['Kevin_mx', 120], ['MaríaJosé', 90], ['Leo', 40]]
  .map(([name, value]) => ({ user: name.toLowerCase(), name, value: tipo === 'gifts' ? value * 7 : value, avatar: '' }));

function settings() {
  const s = { ...cfg };
  if (P.get('estilo') && STYLES.includes(P.get('estilo'))) s.style = P.get('estilo');
  if (P.get('top')) s.top = Number(P.get('top')) || s.top;
  if (s.showTitle === false) s.title = '';
  if (P.get('titulo') !== null) s.title = P.get('titulo') === '0' ? '' : P.get('titulo');
  if (P.get('fondo') === '0') s.bg = false;
  s.top = Math.max(1, Math.min(10, s.top || 5));
  s.title = String(s.title || '').trim();
  return s;
}

const ancho = () => Number(P.get('ancho')) || 900;
const sel = (k) => `[data-k="${CSS.escape(k)}"]`;

// Dibuja todo el overlay. Solo se llama cuando cambia quién aparece o el estilo;
// si solo suben los números se actualizan en su lugar (así las animaciones no se cortan).
function build(s, rows) {
  const empty = `<div class="empty">¡Sé el primero en aparecer aquí!</div>`;
  const cnt = (u) => `<span class="tx-value"><span class="cnt" data-k="${esc(u.user)}">${fmt(u.value)}</span> ${icon}</span>`;
  const plain = (u) => `<span class="tx-value"><span class="cv" data-k="${esc(u.user)}">${fmt(u.value)}</span></span>`;
  const nm = (u) => `<span class="tx-name">${esc(u.name)}</span>`;

  if (s.style === 'podio') {
    const [a, b, c] = rows;
    const col = (u, n, i) => u
      ? `<div class="col p${n}" data-id="${esc(u.user)}" style="--i:${i}"><div class="crown">${n === 1 ? '👑' : ''}</div>${av(u)}<div class="nm shadow">${nm(u)}</div><div class="v">${cnt(u)}</div><div class="step">${n}</div></div>`
      : `<div class="col p${n}"><div class="crown"></div><div class="step" style="opacity:.35">${n}</div></div>`;
    const rest = rows.slice(3).map((u, i) => `<span>${i + 4}. ${nm(u)} · ${plain(u)}</span>`).join('');
    root.innerHTML = `<div class="box"><h1 class="shadow">${esc(s.title)}</h1><div class="stand">${col(b, 2, 0)}${col(a, 1, 1)}${col(c, 3, 2)}</div>${rest ? `<div class="rest">${rest}</div>` : '<div style="height:12px"></div>'}</div>`;
  } else if (s.style === 'lider') {
    const a = rows[0];
    root.innerHTML = a
      ? `<div class="box" data-id="${esc(a.user)}"><div class="who"><span class="crown">👑</span>${av(a)}</div><div><small>${esc(s.title)}</small><b class="shadow">${nm(a)}</b><div class="v">${cnt(a)}</div>${rows[1] ? `<div class="next">Le sigue ${nm(rows[1])} con ${plain(rows[1])}</div>` : ''}</div></div>`
      : `<div class="box"><div><small>${esc(s.title)}</small><b>¿Quién será el primero?</b></div></div>`;
  } else if (s.style === 'bolitas') {
    const list = rows.map((u, i) => `<li data-id="${esc(u.user)}" style="--i:${i}"><div class="orb"><span class="ring"></span><div class="pic">${av(u)}</div><span class="pos">${i + 1}</span>${i === 0 ? '<span class="crown">👑</span>' : ''}</div><div class="lbl"><b class="nm shadow">${nm(u)}</b><span class="v shadow">${cnt(u)}</span></div></li>`).join('');
    root.innerHTML = `<div class="box"><h1 class="shadow">${esc(s.title)}</h1>${list ? `<ol>${list}</ol>` : empty}</div>`;
  } else if (s.style === 'cinta') {
    const items = rows.map((u, i) => `<span class="it" style="--i:${i}">${i === 0 ? '👑' : `${i + 1}.`} ${av(u)} ${nm(u)} <em>${plain(u)} ${icon}</em></span>`).join('');
    const content = items || '<span class="it">¡Sé el primero en aparecer aquí!</span>';
    root.style.setProperty('--w', ancho() + 'px');
    root.innerHTML = `<div class="box"><div class="tag">${esc(s.title)}</div><div class="track"><div class="run">${content}${content}</div></div></div>`;
    const run = root.querySelector('.run');
    root.style.setProperty('--dur', Math.max(10, (run.scrollWidth / 2) / 60) + 's');
  } else {
    const list = rows.map((u, i) => `<li data-id="${esc(u.user)}" style="--i:${i}"><span class="pos">${i + 1}</span>${s.style === 'compacto' ? '' : av(u)}<span class="nm shadow">${nm(u)}</span><span class="v shadow">${cnt(u)}</span></li>`).join('');
    root.innerHTML = `<div class="box"><h1 class="shadow">${esc(s.title)}</h1>${list ? `<ol>${list}</ol>` : empty}</div>`;
  }
  // Sin título: se quita su renglón para que no deje hueco.
  if (!s.title) root.querySelectorAll('h1, .lider small, .cinta .tag').forEach((e) => { if (!e.textContent.trim()) e.remove(); });
  FX.decorate(root.querySelector('.box'));
}

function restart(el, cls) {
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

// Bolitas: la foto late y le salen corazones (o diamantes) según cuántos taps llegaron.
function tapBurst(li, diff) {
  const orb = li?.querySelector('.orb');
  if (!orb || document.hidden) return;
  restart(orb, 'tap');
  const r = orb.getBoundingClientRect();
  const n = Math.min(7, 1 + Math.floor(Math.log10(Math.max(1, diff)) * 2.2));
  for (let i = 0; i < n; i++) {
    const h = document.createElement('span');
    h.className = 'tapfx';
    h.textContent = icon;
    h.style.left = `${r.left + r.width * (0.2 + Math.random() * 0.6) - 10}px`;
    h.style.top = `${r.top + r.height * (0.15 + Math.random() * 0.3)}px`;
    h.style.setProperty('--dx', `${Math.round((Math.random() - 0.5) * 90)}px`);
    h.style.setProperty('--r', `${Math.round((Math.random() - 0.5) * 60)}deg`);
    h.style.animationDelay = `${i * 70}ms`;
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1800 + i * 70);
  }
}

function render() {
  const s = settings();
  let rows = override || last?.[tipo] || [];
  if (!rows.length && P.get('demo') === '1') rows = DEMO;
  rows = rows.slice(0, s.top);
  document.body.classList.toggle('nobg', !s.bg);
  const scale = Number(P.get('escala')) || 1;
  stage.style.transform = `scale(${scale})`;
  root.className = s.style;

  // Qué cambió desde la vez anterior.
  const hadPrev = prev.size > 0;
  const changed = new Set(), entered = new Set(), up = new Set();
  rows.forEach((u, i) => {
    const p = prev.get(u.user);
    if (!p) { if (hadPrev) entered.add(u.user); return; }
    if (p.value !== u.value) changed.add(u.user);
    if (i < p.pos) up.add(u.user);
  });
  const oldLeader = [...prev.entries()].find(([, p]) => p.pos === 0)?.[0];
  const oldVal = new Map([...prev.entries()].map(([k, p]) => [k, p.value]));
  prev = new Map(rows.map((u, i) => [u.user, { value: u.value, pos: i }]));

  const key = [s.style, s.title, s.top, ancho(), FX.on, ...rows.map((u) => `${u.user}:${u.name}:${u.avatar || ''}`)].join('|');
  const el = (u) => root.querySelector(`[data-id="${CSS.escape(u.user)}"]`);
  if (key !== lastKey) {
    const before = FX.snapshot(root);
    build(s, rows);
    FX.flip(root, before, scale);
    if (s.style === 'lider') {
      if (rows[0] && hadPrev && rows[0].user !== oldLeader) { FX.change(el(rows[0]), `lider:${rows[0].user}`); FX.rankUp(el(rows[0])); }
    } else {
      rows.forEach((u) => {
        if (entered.has(u.user) || up.has(u.user)) FX.change(el(u), u.user);
        if (up.has(u.user)) FX.rankUp(el(u));
      });
    }
    lastKey = key;
  }

  // Números: suben poco a poco (o de golpe si está apagado).
  rows.forEach((u) => {
    root.querySelectorAll(`.cv${sel(u.user)}`).forEach((n) => { n.textContent = fmt(u.value); });
    const n = root.querySelector(`.cnt${sel(u.user)}`);
    FX.count(n, `${tipo}:${u.user}`, u.value, fmt, oldVal.get(u.user) ?? 0);
    if (changed.has(u.user) && !entered.has(u.user)) {
      if (FX.on) {
        restart(n?.closest('.v'), 'fx-tick');
        if (s.style === 'bolitas') tapBurst(el(u), u.value - (oldVal.get(u.user) || 0));
      }
      else restart(el(u), 'bump');
    }
  });
  FX.sync(root);
}

// Botón "Probar animación" del panel: alguien de abajo rebasa al primero y luego todo vuelve a lo real.
window.fxDemo = () => {
  const s = settings();
  let rows = (override || last?.[tipo] || []).slice(0, s.top);
  if (!rows.length) rows = DEMO.slice(0, s.top);
  rows = rows.map((u) => ({ ...u }));
  if (rows.length < 2) rows.push({ user: '~nuevo_fan', name: 'Nuevo_fan', value: 1, avatar: '' });
  const t = rows[Math.min(rows.length - 1, 2)];
  t.value = rows[0].value + Math.max(25, Math.round(rows[0].value * 0.15));
  rows.sort((a, b) => b.value - a.value);
  override = rows;
  render();
  clearTimeout(fxDemo.t);
  fxDemo.t = setTimeout(() => { override = null; render(); }, 6000);
};

function applyFx() {
  const a = { ...cfg.anim };
  if (P.get('animacion') === '0') a.on = false;
  FX.apply(a);
}

const socket = io();
socket.on('config', (c) => { cfg = { ...cfg, ...(c.settings?.overlays?.[tipo] || {}) }; applyFx(); applyTextStyle(cfg.text); render(); });
socket.on('rankings', (r) => { last = r; render(); });
applyFx();
render();
</script>

# Construye el instalador de Windows y lo publica en Releases cuando el número
# de versión de package.json todavía no tiene una release completa.
# La app instalada lee esa release y se actualiza sola.
name: Publicar versión

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: ¿Es una versión nueva?
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Todas las releases con esta etiqueta (puede haber restos de intentos fallidos).
          IDS=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q ".[] | select(.tag_name==\"$TAG\") | .id")
          COMPLETE=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q ".[] | select(.tag_name==\"$TAG\" and .draft==false) | select([.assets[].name] | (index(\"latest.yml\") != null and index(\"StreamV2-Setup-$V.exe\") != null and index(\"StreamV2-Setup-$V.exe.blockmap\") != null)) | .id")
          COUNT=$(echo "$IDS" | grep -c . || true)
          # Nunca publicar una versión más vieja que la última (por ejemplo, una ejecución que se quedó en cola).
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name 2>/dev/null | sed 's/^v//' || true)
          if [ -n "$LATEST" ] && [ "$LATEST" != "$V" ] && [ "$(printf '%s\n%s\n' "$V" "$LATEST" | sort -V | tail -n1)" = "$LATEST" ]; then
            echo "La versión $V es más vieja que la publicada ($LATEST); no se publica."
            echo "nueva=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$COMPLETE" ] && [ "$COUNT" = "1" ]; then
            echo "La versión $V ya está publicada; no hay nada que hacer."
            echo "nueva=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for ID in $IDS; do
            echo "Borrando release incompleta $ID ($TAG)."
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"
          done
          git push origin --delete "refs/tags/$TAG" 2>/dev/null || true
          echo "Publicando la versión $V."
          echo "nueva=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.nueva == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: steps.ver.outputs.nueva == 'true'
        run: npm ci

      - name: Preparar la release (borrador)
        if: steps.ver.outputs.nueva == 'true'
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          NOTES=NOTAS.md; [ -f "$NOTES" ] || { echo "Nueva versión de StreamV2." > /tmp/notas.md; NOTES=/tmp/notas.md; }
          gh release create "$TAG" --draft --verify-tag --title "StreamV2 ${{ steps.ver.outputs.version }}" --notes-file "$NOTES"

      - name: Construir y subir el instalador
        if: steps.ver.outputs.nueva == 'true'
        run: npx electron-builder --win --x64 --publish always

      - name: Publicar la release
        if: steps.ver.outputs.nueva == 'true'
        shell: bash
        run: gh release edit "${{ steps.ver.outputs.tag }}" --draft=false --latest
